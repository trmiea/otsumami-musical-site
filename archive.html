<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive | Otsumami Musical Official</title>
    
    <meta property="og:title" content="Otsumami Musical Official">
    <meta property="og:description" content="「おつまみのように気軽にミュージカルを楽しむ」をモットーとした、筑波大学ESSAのOB・OG中心のコミュニティ。">
    <meta property="og:image" content="https://trmiea.github.io/otsumami-musical-site/res/input/logo.png">
    <meta property="og:url" content="https://trmiea.github.io/otsumami-musical-site/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+JP:wght@100;300;700&display=swap" rel="stylesheet">
    <style>
        .hero-bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
            background: #000;
        }
        .hero-bg-video::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(20,20,20,0.7) 50%, rgba(10,10,10,0.9) 100%);
            z-index: 1;
        }
        .hero-bg-video iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
            opacity: 0.4;
        }

        html { scroll-behavior: smooth; }
        body { margin: 0; background: transparent;  font-family: 'Noto Sans JP', sans-serif; background-color: #1a1a1a; color: #f5f5f5; line-height: 1.8; overflow-x: hidden; font-weight: 300; letter-spacing: 0.05em; }
        
        ::selection { background: #c29a5b; color: #000; }
        ::-moz-selection { background: #c29a5b; color: #000; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c29a5b; }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        h1, h2, h3 { letter-spacing: 0.15em; text-align: center; text-transform: uppercase; font-weight: 300; }
        a { color: #c29a5b; text-decoration: none; transition: 0.3s; }
        a:hover { opacity: 0.7; }
        
        nav { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 1000; border-bottom: 1px solid #333; }
        nav .container { display: flex; justify-content: space-between; align-items: center; height: 65px; }
        nav .logo { font-weight: 700; color: #c29a5b; font-size: 1.1rem; }
        nav ul { display: flex; list-style: none; margin: 0; padding: 0; }
        nav ul li { margin-left: 20px; font-size: 0.8rem; }
        
        header { padding: 120px 0 40px; text-align: center; background: transparent; }
        .hero-title { font-family: 'Cinzel', serif; font-size: 3rem; margin-bottom: 20px; font-weight: 700; color: #c29a5b; letter-spacing: 0.1em; text-shadow: 0 0 20px rgba(194, 154, 91, 0.4); }
        
        .archive-grid { display: flex; flex-direction: column; gap: 60px; margin-top: 20px; }
        .archive-card { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 50px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); border-top: 4px solid #c29a5b; transition: all 0.4s ease; position: relative; overflow: hidden; }
        .archive-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at top right, rgba(194,154,91,0.05), transparent 50%); opacity: 0; transition: 0.4s; pointer-events: none; }
        .archive-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.6); border-color: #d4af37; }
        .archive-card:hover::before { opacity: 1; }
        .archive-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .archive-title { font-family: 'Cinzel', serif; font-size: 2rem; margin: 0; color: #c29a5b; font-weight: 700; }
        .archive-date { font-size: 1rem; color: #888; }
        .archive-content { display: flex; flex-direction: column; gap: 30px; }
        @media (max-width: 768px) { .archive-header { flex-direction: column; align-items: flex-start; gap: 10px; } }
        
        .song-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .song-item { background: transparent; font-size: 0.95rem; transition: 0.3s; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .song-item-content { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; color: inherit; text-decoration: none; transition: 0.3s; }
        @media (max-width: 600px) { .song-item-content { flex-direction: column; align-items: flex-start; gap: 5px; } }
        .song-item a.song-item-content:hover { background: rgba(194, 154, 91, 0.15); padding-left: 25px; }
        .song-item a.song-item-content:hover .song-title { color: #c29a5b; }
        .song-title { font-weight: 700; display: block; color: #fff; transition: 0.3s; font-size: 1rem; letter-spacing: 0.05em; }
        .song-work { font-size: 0.8rem; color: #888; }
        
        .links-area { text-align: center; margin: 10px 0 30px; }
        .btn-gold-outline { display: inline-block; border: 1px solid #c29a5b; color: #c29a5b; padding: 12px 25px; border-radius: 50px; font-size: 0.9rem; letter-spacing: 0.1em; transition: 0.3s; margin-top: 15px; width: 100%; box-sizing: border-box; position: relative; overflow: hidden; }
        .btn-gold-outline::after { content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(194,154,91,0.3) 50%, rgba(255,255,255,0) 100%); transform: skewX(-25deg); transition: 0.5s; }
        .btn-gold-outline:hover { background: #c29a5b; color: #000; box-shadow: 0 4px 15px rgba(194,154,91,0.4); }
        .btn-gold-outline:hover::after { left: 150%; }
        
        footer { padding: 60px 0; text-align: center; font-size: 0.75rem; color: #666; background: rgba(0,0,0,0.6); margin-top: 80px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        
        .fade-in { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
        
        #back-to-top { position: fixed; bottom: 30px; right: 30px; background: rgba(194, 154, 91, 0.8); color: #000; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight: bold; cursor: pointer; z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #back-to-top.show { opacity: 1; visibility: visible; }
        #back-to-top:hover { background: #c29a5b; transform: translateY(-3px); }

        /* Hamburger Menu (Global) */
        .menu-toggle {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 35px;
            height: 25px;
            cursor: pointer;
            z-index: 1001;
            margin-left: auto;
        }
        .menu-toggle span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: #c29a5b;
            border-radius: 2px;
            transition: 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .menu-toggle.is-active span:nth-child(1) { transform: translateY(11.5px) rotate(45deg); }
        .menu-toggle.is-active span:nth-child(2) { opacity: 0; }
        .menu-toggle.is-active span:nth-child(3) { transform: translateY(-11.5px) rotate(-45deg); }

        .nav-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(5,5,5,0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 999; opacity: 0; visibility: hidden; transition: 0.4s;
        }
        .nav-overlay.is-active { opacity: 1; visibility: visible; }

        nav ul.nav-links {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            padding: 120px 0 50px 0; /* Space for navbar */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 40px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s;
            overflow-y: auto;
            margin: 0;
        }
        nav ul.nav-links.is-active { opacity: 1; visibility: visible; }
        
        nav ul.nav-links li { margin: 0; }
        nav ul.nav-links li a { font-size: 2rem; font-weight: 700; letter-spacing: 0.1em; color: #fff; }
        nav ul.nav-links li a:hover { color: #c29a5b; }

        @media (max-width: 768px) {
            nav .container { padding: 0 20px; height: 70px; }
            nav .logo img { height: 45px; margin-right: 10px; }
            nav .logo { font-size: 1.1rem; }
            
            nav ul.nav-links li a { font-size: 1.5rem; }
            
            section { padding: 80px 0; }
            .hero-title { font-size: 2.2rem !important; }
            h2 { font-size: 1.8rem; }
            
            .next-card { padding: 40px 20px; }
            .next-date { font-size: 1.8rem; }
            .btn-gold { padding: 15px 30px; font-size: 0.9rem !important; width: 100%; box-sizing: border-box; text-align: center; }
            .stats-grid { grid-template-columns: 1fr; gap: 15px; }
            
            #yt-main-container h3 { font-size: 1.4rem !important; }
            .archive-title { font-size: 1.5rem; }
            .archive-card { padding: 25px; }
        }
    </style>
</head>
<body>
    <div class="hero-bg-video" id="hero-bg-container"></div>
    <nav>
        <div class="container">
            <a href="index.html" class="logo">Otsumami Musical</a>
            <div class="menu-toggle" id="mobile-menu">
                <span></span><span></span><span></span>
            </div>
            <div class="nav-overlay" id="nav-overlay"></div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html#about">ABOUT</a></li>
                <li><a href="index.html#next">NEXT</a></li>
                <li><a href="index.html#youtube">YOUTUBE</a></li>
                <li><a href="archive.html">ARCHIVE</a></li>
            </ul>
        </div>
    </nav>

    <header class="fade-in">
        <div class="container">
            <h1 class="hero-title">Performance Archive</h1>
            <p style="color: #888;">過去の発表会の記録・セットリスト</p>
        </div>
    </header>

    <section class="fade-in">
        <div class="container">
            <div class="archive-grid" id="archive-container">
                <!-- Data will be loaded here -->
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Otsumami Musical | University of Tsukuba ESSA Alumni Network</p>
    </footer>

    <div id="back-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑</div>

    <script>
        function getYouTubeId(url) {
            if(!url) return null;
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
            return match ? match[1] : null;
        }

        // Fetch info for background video
        fetch('./res/input/info.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('hero-bg-container').innerHTML = `<iframe src="https://www.youtube.com/embed/${data.hero.video_id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${data.hero.video_id}&playsinline=1&showinfo=0&rel=0" frameborder="0" allow="autoplay; fullscreen" style="pointer-events: none;"></iframe>`;
            })
            .catch(err => console.error(err));

        fetch('./res/input/archive.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('archive-container');
                container.innerHTML = data.map(vol => {
                    const digestSong = vol.songs.find(s => s.title.includes("ダイジェスト"));
                    const otherSongs = vol.songs.filter(s => !s.title.includes("ダイジェスト"));
                    const digestId = digestSong ? getYouTubeId(digestSong.youtube_url) : null;
                    
                    return `
                    <div class="archive-card">
                        <div class="archive-header">
                            <h2 class="archive-title">${vol.title}</h2>
                            <div class="archive-date">${vol.date}</div>
                        </div>
                                                    <div class="archive-content">
                                ${digestId ? `
                                <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);">
                                    <iframe style="position: absolute; top:0; left:0; width:100%; height:100%; border:none;" src="https://www.youtube.com/embed/${digestId}" allowfullscreen></iframe>
                                </div>
                                ` : ''}
                                
                                <div class="links-area">
                                    <a href="${vol.album_url}" target="_blank" class="btn-gold-outline" style="margin-top: 0; max-width: 400px; width: 100%; font-size: 1rem; padding: 15px 30px; border-radius: 50px; background: rgba(194, 154, 91, 0.05);">
                                        Photos & Videos ↗
                                    </a>
                                </div>

                                <div style="margin-top: 10px;">
                                    <h3 style="text-align: left; font-size: 1.2rem; margin-bottom: 20px; color: #c29a5b; border-bottom: 1px solid rgba(194,154,91,0.3); padding-bottom: 10px;">
                                        Setlist <span style="font-size: 0.9rem; color: #888;">(${otherSongs.length} songs)</span>
                                    </h3>
                                    <ul class="song-list">
                                        ${otherSongs.map(song => `
                                            <li class="song-item">
                                                ${song.youtube_url ? `<a href="${song.youtube_url}" target="_blank" class="song-item-content">` : `<div class="song-item-content">`}
                                                    <span class="song-title">${song.youtube_url ? '<span style="color:#c29a5b; margin-right:8px; font-size: 0.8rem;">▶︎</span>' : ''}${song.title}</span>
                                                    <span class="song-work">${song.work}</span>
                                                ${song.youtube_url ? `</a>` : `</div>`}
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            </div>
                    </div>
                `}).join('');
                // Init scroll animations with stagger
                const observer = new IntersectionObserver((entries) => {
                    let delay = 0;
                    entries.forEach(entry => {
                        if(entry.isIntersecting) {
                            setTimeout(() => {
                                entry.target.classList.add('visible');
                            }, delay);
                            delay += 150;
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0, rootMargin: '0px 0px -50px 0px' }); 
                
                const elements = document.querySelectorAll('.fade-in, .archive-card');
                elements.forEach((el, index) => {
                    el.classList.add('fade-in');
                    // Immediately show the header and the first card to avoid "empty" feel
                    if (index < 3) {
                        setTimeout(() => el.classList.add('visible'), index * 150);
                    } else {
                        setTimeout(() => observer.observe(el), 100);
                    }
                });
                
                // Back to top logic
                window.addEventListener('scroll', () => {
                    const btn = document.getElementById('back-to-top');
                    if (window.scrollY > 300) btn.classList.add('show');
                    else btn.classList.remove('show');
                });
            })
            .catch(err => {
                console.error("Data load failed:", err);
                document.getElementById('archive-container').innerHTML = `<p style="color:red; text-align:center;">データの読み込みに失敗しました。ローカル環境の場合はローカルサーバー（Live Server等）経由で開いてください。<br>Error: ${err.message}</p>`;
            });

        // Mobile Menu Logic
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');
        const navOverlay = document.getElementById('nav-overlay');
        if (mobileMenu && navLinks && navOverlay) {
            const toggleMenu = () => {
                mobileMenu.classList.toggle('is-active');
                navLinks.classList.toggle('is-active');
                navOverlay.classList.toggle('is-active');
            };
            mobileMenu.addEventListener('click', toggleMenu);
            navOverlay.addEventListener('click', toggleMenu);
            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', toggleMenu);
            });
        }
    </script>
</body>
</html>
