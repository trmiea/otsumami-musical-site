<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive | Otsumami Musical Official</title>
    
    <meta property="og:title" content="Otsumami Musical Official">
    <meta property="og:description" content="「おつまみのように気軽にミュージカルを楽しむ」をモットーとした、筑波大学ESSAのOB・OG中心のコミュニティ。">
    <meta property="og:image" content="https://trmiea.github.io/otsumami-musical-site/res/input/logo.png">
    <meta property="og:url" content="https://trmiea.github.io/otsumami-musical-site/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+JP:wght@100;300;700&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { margin: 0; font-family: 'Noto Sans JP', sans-serif; background-color: #1a1a1a; color: #f5f5f5; line-height: 1.8; overflow-x: hidden; font-weight: 300; letter-spacing: 0.05em; }
        
        ::selection { background: #c29a5b; color: #000; }
        ::-moz-selection { background: #c29a5b; color: #000; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c29a5b; }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        h1, h2, h3 { letter-spacing: 0.15em; text-align: center; text-transform: uppercase; font-weight: 300; }
        a { color: #c29a5b; text-decoration: none; transition: 0.3s; }
        a:hover { opacity: 0.7; }
        
        nav { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 1000; border-bottom: 1px solid #333; }
        nav .container { display: flex; justify-content: space-between; align-items: center; height: 65px; }
        nav .logo { font-weight: 700; color: #c29a5b; font-size: 1.1rem; }
        nav ul { display: flex; list-style: none; margin: 0; padding: 0; }
        nav ul li { margin-left: 20px; font-size: 0.8rem; }
        
        header { padding: 140px 0 80px; text-align: center; background: #000; }
        .hero-title { font-family: 'Cinzel', serif; font-size: 3rem; margin-bottom: 20px; font-weight: 700; color: #c29a5b; letter-spacing: 0.1em; text-shadow: 0 0 20px rgba(194, 154, 91, 0.4); }
        
        .archive-grid { display: flex; flex-direction: column; gap: 60px; margin-top: 50px; }
        .archive-card { background: #1a1a1a; padding: 40px; border-radius: 12px; border: 1px solid #333; border-top: 4px solid #c29a5b; transition: all 0.4s ease; position: relative; overflow: hidden; }
        .archive-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at top right, rgba(194,154,91,0.05), transparent 50%); opacity: 0; transition: 0.4s; pointer-events: none; }
        .archive-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.6); border-color: #d4af37; }
        .archive-card:hover::before { opacity: 1; }
        .archive-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .archive-title { font-family: 'Cinzel', serif; font-size: 2rem; margin: 0; color: #c29a5b; font-weight: 700; }
        .archive-date { font-size: 1rem; color: #888; }
        .archive-content { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }
        @media (max-width: 768px) { .archive-content { grid-template-columns: 1fr; } .archive-header { flex-direction: column; align-items: flex-start; gap: 10px; } }
        
        .song-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .song-item { background: #222; border-radius: 8px; font-size: 0.9rem; transition: 0.3s; }
        .song-item-content { padding: 15px; display: block; color: inherit; text-decoration: none; }
        .song-item a.song-item-content:hover { background: #2a2a2a; border-radius: 8px; }
        .song-item a.song-item-content:hover .song-title { color: #c29a5b; }
        .song-title { font-weight: 700; display: block; margin-bottom: 5px; color: #fff; transition: 0.3s; }
        .song-work { font-size: 0.8rem; color: #888; }
        
        .links-area { background: #000; padding: 25px; border-radius: 8px; height: fit-content; text-align: center; }
        .btn-gold-outline { display: inline-block; border: 1px solid #c29a5b; color: #c29a5b; padding: 12px 25px; border-radius: 50px; font-size: 0.9rem; letter-spacing: 0.1em; transition: 0.3s; margin-top: 15px; width: 100%; box-sizing: border-box; position: relative; overflow: hidden; }
        .btn-gold-outline::after { content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(194,154,91,0.3) 50%, rgba(255,255,255,0) 100%); transform: skewX(-25deg); transition: 0.5s; }
        .btn-gold-outline:hover { background: #c29a5b; color: #000; box-shadow: 0 4px 15px rgba(194,154,91,0.4); }
        .btn-gold-outline:hover::after { left: 150%; }
        
        footer { padding: 80px 0; text-align: center; font-size: 0.75rem; color: #666; background: #000; margin-top: 80px; }
        
        .fade-in { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
        
        #back-to-top { position: fixed; bottom: 30px; right: 30px; background: rgba(194, 154, 91, 0.8); color: #000; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight: bold; cursor: pointer; z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #back-to-top.show { opacity: 1; visibility: visible; }
        #back-to-top:hover { background: #c29a5b; transform: translateY(-3px); }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="index.html" class="logo">Otsumami Musical</a>
            <ul>
                <li><a href="index.html#about">ABOUT</a></li>
                <li><a href="index.html#next">NEXT</a></li>
                <li><a href="index.html#youtube">YOUTUBE</a></li>
                <li><a href="archive.html">ARCHIVE</a></li>
            </ul>
        </div>
    </nav>

    <header class="fade-in">
        <div class="container">
            <h1 class="hero-title">Performance Archive</h1>
            <p style="color: #888;">過去の発表会の記録・セットリスト</p>
        </div>
    </header>

    <section class="fade-in">
        <div class="container">
            <div class="archive-grid" id="archive-container">
                <!-- Data will be loaded here -->
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Otsumami Musical | University of Tsukuba ESSA Alumni Network</p>
    </footer>

    <div id="back-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑</div>

    <script>
        fetch('./res/input/archive.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('archive-container');
                container.innerHTML = data.map(vol => `
                    <div class="archive-card">
                        <div class="archive-header">
                            <h2 class="archive-title">${vol.title}</h2>
                            <div class="archive-date">${vol.date}</div>
                        </div>
                        <div class="archive-content">
                            <div>
                                <h3 style="text-align: left; font-size: 1.1rem; margin-top: 0;">Setlist (${vol.songs.length} songs)</h3>
                                <ul class="song-list">
                                    ${vol.songs.map(song => `
                                        <li class="song-item">
                                            ${song.youtube_url ? `<a href="${song.youtube_url}" target="_blank" class="song-item-content">` : `<div class="song-item-content">`}
                                                <span class="song-title">${song.title}${song.youtube_url ? ' <span style="font-size:0.8rem; color:#c29a5b; margin-left:5px;">▶︎</span>' : ''}</span>
                                                <span class="song-work">${song.work}</span>
                                            ${song.youtube_url ? `</a>` : `</div>`}
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                            <div class="links-area">
                                <div style="display: flex; gap: 10px;">
                                    <a href="${vol.photo_url}" target="_blank" class="btn-gold-outline" style="margin-top: 0; text-align: center; flex: 1;">Photos ↗</a>
                                    <a href="${vol.video_url}" target="_blank" class="btn-gold-outline" style="margin-top: 0; text-align: center; flex: 1;">Videos ↗</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
                // Init scroll animations with stagger
                const observer = new IntersectionObserver((entries) => {
                    let delay = 0;
                    entries.forEach(entry => {
                        if(entry.isIntersecting) {
                            setTimeout(() => {
                                entry.target.classList.add('visible');
                            }, delay);
                            delay += 150; // stagger effect
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.05 }); // Lowered threshold just in case
                document.querySelectorAll('.fade-in, .archive-card').forEach(el => {
                    el.classList.add('fade-in');
                    // Add a tiny delay to ensure DOM is ready before observing
                    setTimeout(() => observer.observe(el), 100);
                });
                
                // Back to top logic
                window.addEventListener('scroll', () => {
                    const btn = document.getElementById('back-to-top');
                    if (window.scrollY > 300) btn.classList.add('show');
                    else btn.classList.remove('show');
                });
            })
            .catch(err => {
                console.error("Data load failed:", err);
                document.getElementById('archive-container').innerHTML = `<p style="color:red; text-align:center;">データの読み込みに失敗しました。ローカル環境の場合はローカルサーバー（Live Server等）経由で開いてください。<br>Error: ${err.message}</p>`;
            });
    </script>
</body>
</html>
