<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otsumami Musical Official</title>

    <meta property="og:title" content="Otsumami Musical Official">
    <meta property="og:description" content="「おつまみのように気軽にミュージカルを楽しむ」をモットーとした、筑波大学ESSAのOB・OG中心のコミュニティ。">
    <meta property="og:image" content="https://trmiea.github.io/otsumami-musical-site/res/input/logo.png">
    <meta property="og:url" content="https://trmiea.github.io/otsumami-musical-site/">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+JP:wght@100;300;700&display=swap"
        rel="stylesheet">

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #050505;
            color: #f5f5f5;
            line-height: 1.8;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1,
        h2,
        h3 {
            letter-spacing: 0.15em;
            text-align: center;
            text-transform: uppercase;
            font-weight: 300;
        }

        a {
            color: #c29a5b;
            text-decoration: none;
            transition: 0.3s;
        }

        a:hover {
            opacity: 0.7;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 90px;
        }

        nav .logo {
            display: flex;
            align-items: center;
            font-weight: 700;
            color: #c29a5b;
            font-size: 1.4rem;
            letter-spacing: 0.05em;
        }
        nav .logo img {
            height: 55px; /* Adjusting for cropped image, 55px is now purely the logo */
            margin-right: 18px;
            filter: drop-shadow(0 0 5px rgba(194, 154, 91, 0.4));
        }

        nav ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            margin-left: 25px;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }
        
        nav ul li a {
            color: #ccc;
            transition: color 0.3s;
        }
        
        nav ul li a:hover {
            color: #fff;
        }

        header {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            overflow: hidden;
        }

        .hero-bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: -1;
            opacity: 0.8;
        }

        .hero-bg-video::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(17,17,17,1) 100%);
            z-index: 2;
        }

        .hero-bg-video iframe {
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
        }

        .hero-title {
            font-family: 'Cinzel', serif;
            font-size: 5.5rem;
            margin-bottom: 0;
            font-weight: 700;
            background: linear-gradient(to right, #e8d099, #c29a5b, #e8d099);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.1em;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }

        @media (max-width: 600px) {
            .hero-title {
                font-size: 3.5rem;
            }
        }
        
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: bounce 2s infinite;
        }
        
        .scroll-indicator::after {
            content: '';
            display: block;
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.5), transparent);
            margin-top: 15px;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -10px); }
            60% { transform: translate(-50%, -5px); }
        }

        section {
            padding: 120px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            background-color: rgba(5, 5, 5, 0.65);
        }

        .section-intro {
            background-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-top: 60px;
        }

        .stat-item {
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 40px 20px;
            border-bottom: 3px solid #c29a5b;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border-radius: 16px 16px 0 0;
        }

        .stat-item:hover {
            transform: translateY(-8px);
            background: rgba(40, 40, 40, 0.6);
        }

        .stat-number {
            display: block;
            font-size: 3rem;
            color: #c29a5b;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #aaa;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .next-card {
            background: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 80px 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .next-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #c29a5b, transparent);
        }

        .next-date {
            font-size: 2.5rem;
            color: #c29a5b;
            margin: 30px 0;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .btn-gold {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #fff !important;
            padding: 20px 60px;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 0.15em;
            box-shadow: 0 10px 20px rgba(170, 124, 17, 0.2);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .btn-gold:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(170, 124, 17, 0.4);
            background: linear-gradient(135deg, #ebd171, #c29a5b);
        }

        .yt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 50px;
            margin-top: 60px;
        }

        @media (max-width: 500px) {
            .yt-grid {
                grid-template-columns: 1fr;
            }
        }

        .yt-item {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .yt-item:hover {
            border-color: rgba(194, 154, 91, 0.5);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        
        .yt-label {
            color: #eee !important;
            transition: color 0.3s;
        }
        
        .yt-item:hover .yt-label {
            color: #c29a5b !important;
        }

        footer {
            padding: 80px 0;
            text-align: center;
            font-size: 0.8rem;
            color: #555;
            background: rgba(5, 5, 5, 0.9);
            letter-spacing: 0.05em;
        }

        .fade-in {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 1s cubic-bezier(0.2, 0.8, 0.2, 1), transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #back-to-top {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: rgba(194, 154, 91, 0.8);
            backdrop-filter: blur(5px);
            color: #000;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        #back-to-top.show {
            opacity: 1;
            visibility: visible;
        }

        #back-to-top:hover {
            background: #c29a5b;
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(194, 154, 91, 0.4);
        }

        /* Hamburger Menu (Global) */
        .menu-toggle {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 35px;
            height: 25px;
            cursor: pointer;
            z-index: 1001;
            margin-left: auto;
        }
        .menu-toggle span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: #c29a5b;
            border-radius: 2px;
            transition: 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .menu-toggle.is-active span:nth-child(1) { transform: translateY(11.5px) rotate(45deg); }
        .menu-toggle.is-active span:nth-child(2) { opacity: 0; }
        .menu-toggle.is-active span:nth-child(3) { transform: translateY(-11.5px) rotate(-45deg); }

        .nav-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(5,5,5,0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 999; opacity: 0; visibility: hidden; transition: 0.4s;
        }
        .nav-overlay.is-active { opacity: 1; visibility: visible; }

        nav ul.nav-links {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            padding: 120px 0 50px 0; /* Space for navbar */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 40px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s;
            overflow-y: auto;
            margin: 0;
        }
        nav ul.nav-links.is-active { opacity: 1; visibility: visible; }
        
        nav ul.nav-links li { margin: 0; }
        nav ul.nav-links li a { font-size: 2rem; font-weight: 700; letter-spacing: 0.1em; color: #fff; }
        nav ul.nav-links li a:hover { color: #c29a5b; }

        @media (max-width: 768px) {
            nav .container { padding: 0 20px; height: 70px; }
            nav .logo img { height: 45px; margin-right: 10px; }
            nav .logo { font-size: 1.1rem; }
            
            nav ul.nav-links li a { font-size: 1.5rem; }
            
            section { padding: 80px 0; }
            .hero-title { font-size: 2.2rem !important; }
            h2 { font-size: 1.8rem; }
            
            .next-card { padding: 40px 20px; }
            .next-date { font-size: 1.8rem; }
            .btn-gold { padding: 15px 30px; font-size: 0.9rem !important; width: 100%; box-sizing: border-box; text-align: center; }
            .stats-grid { grid-template-columns: 1fr; gap: 15px; }
            
            #yt-main-container h3 { font-size: 1.4rem !important; }
            .archive-title { font-size: 1.5rem; }
            .archive-card { padding: 25px; }
        }
    </style>
</head>

<body>

    <!-- Fixed Background Video -->
    <div class="hero-bg-video" id="hero-bg-container"></div>

    <nav>
        <div class="container">
            <div class="logo"><img src="./res/input/logo2_cropped.png" alt="Logo">Otsumami Musical</div>
            <div class="menu-toggle" id="mobile-menu">
                <span></span><span></span><span></span>
            </div>
            <div class="nav-overlay" id="nav-overlay"></div>
            <ul class="nav-links" id="nav-links">
                <li><a href="#about">ABOUT</a></li>
                <li><a href="#next">NEXT</a></li>
                <li><a href="#youtube">YOUTUBE</a></li>
                <li><a href="vol8.html">VOL.8</a></li>
                <li><a href="archive.html">ARCHIVE</a></li>
            </ul>
        </div>
    </nav>

    <header id="top">
        <div class="container hero-content">
            <div class="hero-title fade-in" id="hero-title">--</div>
        </div>
        <div class="scroll-indicator fade-in">Scroll Down</div>
    </header>

    <section class="section-intro fade-in" id="about">
        <div class="container">
            <h2>About Us</h2>
            <div class="intro-text" id="about-desc"
                style="text-align: center; color: #ccc; max-width: 750px; margin: 0 auto;">--</div>
            <div class="stats-grid" id="stats-container"></div>
        </div>
    </section>

    <section id="next" class="fade-in">
        <div class="container">
            <h2>Next</h2>
            <div class="next-card">
                <h3 id="next-title">--</h3>
                <div class="next-date" id="next-date">--</div>

                <p id="next-desc" style="color: #888; font-size: 0.95rem; margin: 25px 0;">--</p><a href="#"
                    id="next-link" class="btn-gold">--</a>
            </div>
        </div>
    </section>

    <section class="section-youtube fade-in" id="youtube">
        <div class="container">
            <h2>YouTube Archives</h2>
            <p id="yt-desc" style="text-align: center; color: #888; margin-bottom: 20px;">--</p>
            <div style="text-align: center; margin-bottom: 50px;">
                <a href="https://www.youtube.com/@otsumami_musical" target="_blank" class="btn-gold"
                    style="font-size: 1rem; padding: 12px 30px;">▶︎ 公式YouTubeチャンネルへ</a>
            </div>
            <div id="yt-main-container" style="margin-bottom: 60px;"></div>

            <div class="yt-grid" id="yt-container"></div>

            <div style="text-align: center; margin-top: 100px; padding-top: 60px; border-top: 1px solid rgba(255,255,255,0.05);" class="fade-in">
                <h3 style="font-size: 2rem; margin-bottom: 15px; color: #c29a5b;">Performance Archive</h3>
                <p style="color: #aaa; margin-bottom: 40px; font-size: 0.95rem;">過去の発表会の記録・セットリストはこちらから</p>
                <a href="archive.html" class="btn-gold" style="font-size: 1.1rem; padding: 18px 50px;">
                    アーカイブページへ
                </a>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Otsumami Musical | University of Tsukuba ESSA Alumni Network</p>
    </footer>

    <div id="back-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑</div>

    <script>
        fetch('./res/input/info.json')
            .then(res => res.json())
            .then(data => {
                // SEO & GA
                document.title = data.hero.title + " Official";
                const favicon = document.createElement('link');
                favicon.rel = 'icon'; favicon.type = 'image/png'; favicon.href = data.settings.favicon_path;
                document.head.appendChild(favicon);

                const gaScript = document.createElement('script');
                gaScript.async = true; gaScript.src = `https://www.googletagmanager.com/gtag/js?id=${data.settings.ga_id}`;
                document.head.appendChild(gaScript);
                window.dataLayer = window.dataLayer || [];
                function gtag() { dataLayer.push(arguments); }
                gtag('js', new Date());
                gtag('config', data.settings.ga_id);

                // Hero
                document.getElementById('hero-title').textContent = data.hero.title;
                document.getElementById('hero-bg-container').innerHTML = `<iframe src="https://www.youtube.com/embed/${data.hero.video_id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${data.hero.video_id}&playsinline=1&showinfo=0&rel=0" frameborder="0" allow="autoplay; fullscreen" style="pointer-events: none;"></iframe>`;

                // About
                document.getElementById('about-desc').innerHTML = data.about.description;
                document.getElementById('stats-container').innerHTML = data.about.stats.map(s => `
                    <div class="stat-item"><span class="stat-number">${s.num}</span><span class="stat-label">${s.label}</span></div>
                `).join('');

                // Next Event
                document.getElementById('next-title').textContent = data.next_event.title;
                document.getElementById('next-date').textContent = data.next_event.date;

                document.getElementById('next-desc').innerHTML = data.next_event.description;
                const linkBtn = document.getElementById('next-link');
                linkBtn.textContent = data.next_event.btn_text;
                linkBtn.href = data.next_event.btn_link || data.next_event.url || "#";

                // YouTube
                document.getElementById('yt-desc').textContent = data.youtube.section_desc;
                
                if (data.youtube.main_video) {
                    const mv = data.youtube.main_video;
                    document.getElementById('yt-main-container').innerHTML = `
                        <div class="yt-item" style="max-width: 800px; margin: 0 auto; border-color: rgba(194,154,91,0.4); box-shadow: 0 15px 40px rgba(194,154,91,0.2);">
                            <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px;"><iframe style="position: absolute; top:0; left:0; width:100%; height:100%; border:none;" src="https://www.youtube.com/embed/${mv.embed_id}" allowfullscreen></iframe></div>
                            <a href="${mv.url}" class="yt-label" target="_blank" style="display:block; text-align:center; margin-top:25px; font-size: 1.25rem; font-weight:700;">${mv.label}</a>
                        </div>
                    `;
                }

                document.getElementById('yt-container').innerHTML = data.youtube.playlists.map(p => `
                    <div class="yt-item">
                        <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px;"><iframe style="position: absolute; top:0; left:0; width:100%; height:100%; border:none;" src="https://www.youtube.com/embed/${p.embed_id}" allowfullscreen></iframe></div>
                        <a href="${p.url}" class="yt-label" target="_blank" style="display:block; text-align:center; margin-top:20px; font-weight:700;">${p.label}</a>
                    </div>
                `).join('');

                // Init scroll animations
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) { entry.target.classList.add('visible'); }
                    });
                }, { threshold: 0.1 });
                document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

                // Back to top logic
                window.addEventListener('scroll', () => {
                    const btn = document.getElementById('back-to-top');
                    if (window.scrollY > 300) btn.classList.add('show');
                    else btn.classList.remove('show');
                });
            })
            .catch(err => console.error("Data load failed:", err));

        // Mobile Menu Logic
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');
        const navOverlay = document.getElementById('nav-overlay');
        if (mobileMenu && navLinks && navOverlay) {
            const toggleMenu = () => {
                mobileMenu.classList.toggle('is-active');
                navLinks.classList.toggle('is-active');
                navOverlay.classList.toggle('is-active');
            };
            mobileMenu.addEventListener('click', toggleMenu);
            navOverlay.addEventListener('click', toggleMenu);
            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', toggleMenu);
            });
        }
    </script>
</body>

</html>
